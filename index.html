<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Warning Checker</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 16px 80px;
    background: #f7f7f8;
    color: #1a1a1a;
  }
  header { margin-bottom: 24px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: #666; font-size: 14px; margin: 0; }

  .search-wrap { position: relative; margin-bottom: 20px; }
  input {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 10px;
    background: white;
    outline: none;
    transition: border .15s;
  }
  input:focus { border-color: #333; }

  .stats {
    font-size: 13px;
    color: #888;
    margin-bottom: 16px;
  }

  .card {
    background: white;
    border: 1px solid #ececec;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    transition: box-shadow .15s;
  }
  .card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.06); }

  .card img {
    width: 88px;
    height: 88px;
    object-fit: cover;
    border-radius: 10px;
    background: #f0f0f0;
    flex-shrink: 0;
  }
  .card-body { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 16px; margin: 0 0 2px; }
  .meta { font-size: 13px; color: #888; margin-bottom: 8px; }
  .warnings { font-size: 22px; line-height: 1.2; margin-bottom: 6px; }
  .warnings.safe { font-size: 14px; color: #16a34a; font-weight: 500; }
  .ingredients {
    font-size: 12px;
    color: #666;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .empty, .loading {
    text-align: center;
    color: #999;
    padding: 48px 0;
    font-size: 15px;
  }

  .error {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 14px;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .error code { background: #fff; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>🍽️ Food Warning Checker</h1>
  <p class="sub">Search a product to see its warnings.</p>
</header>

<div class="search-wrap">
  <input id="search" type="text" placeholder="Search by name, brand, or barcode..." autocomplete="off" />
</div>

<div class="stats" id="stats"></div>
<div id="results"></div>

<script>
// ============================================================
//  👇 PASTE YOUR PUBLISHED CSV URL BETWEEN THE QUOTES BELOW
// ============================================================
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTAIDSLnIsDSHF55vZI15vM3ByLl6U4UnNapRT1UdAKPkM7H3V1OFuLuhOPoAVnx4-F0P5wBzVY0db4/pub?gid=0&single=true&output=csv";
// ============================================================

let products = [];

// --- CSV Parser (handles quoted fields with commas/newlines) ---
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') {}
      else field += c;
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }

  if (!rows.length) return [];
  const headers = rows.shift().map(h => h.trim().toLowerCase());
  return rows
    .filter(r => r.some(c => (c || "").trim() !== ""))
    .map(r => Object.fromEntries(headers.map((h, i) => [h, (r[i] || "").trim()])));
}

// --- Render ---
function render(list, query = "") {
  const container = document.getElementById("results");
  const stats = document.getElementById("stats");

  if (!list.length) {
    if (query) {
      const emailLink = "mailto:YOUR_EMAIL@gmail.com" +
        "?subject=" + encodeURIComponent("Add product: " + query) +
        "&body=" + encodeURIComponent(
          "Hi,\n\nI'd like to add this product to your database:\n\n" +
          "Product: " + query + "\n\n" +
          "(Please attach a photo of the ingredients label below)\n\n" +
          "Thanks!"
        );
      container.innerHTML = `
        <div class="card" style="display:block;text-align:center;padding:32px 20px;">
          <div style="font-size:40px;margin-bottom:12px;">🔍</div>
          <p style="font-size:16px;font-weight:600;margin:0 0 8px;">
            "${escapeHTML(query)}" isn't in our database yet.
          </p>
          <p style="color:#666;font-size:14px;margin:0 0 20px;">
            Snap a photo of the ingredients label and email it to us. We'll add it.
          </p>
          <a href="${emailLink}"
             style="display:inline-block;background:#111;color:white;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600;">
            📧 Email us the label
          </a>
          <p style="color:#aaa;font-size:12px;margin-top:16px;">
            We review every submission personally.
          </p>
        </div>
      `;
    } else {
      container.innerHTML = '<p class="empty">No products found.</p>';
    }
    stats.textContent = "";
    return;
  }

  stats.textContent = `Showing ${list.length} of ${products.length} products`;

  container.innerHTML = list.map(p => {
    const warnings = (p.warnings || "").trim();
    const warnHTML = warnings
      ? `<div class="warnings">${warnings}</div>`
      : `<div class="warnings safe">✅ No warnings flagged</div>`;

    const img = p.image_url
      ? `<img src="${p.image_url}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : `<div style="width:88px;height:88px;background:#f0f0f0;border-radius:10px;flex-shrink:0;"></div>`;

    return `
      <div class="card">
        ${img}
        <div class="card-body">
          <p class="name">${escapeHTML(p.name || "Unnamed")}</p>
          <div class="meta">${escapeHTML(p.brand || "")}${p.brand && p.category ? " · " : ""}${escapeHTML(p.category || "")}</div>
          ${warnHTML}
          <div class="ingredients">${escapeHTML(p.ingredients_raw || "")}</div>
        </div>
      </div>
    `;
  }).join("");
}
function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

// --- Load ---
async function loadProducts() {
  const container = document.getElementById("results");
  container.innerHTML = '<p class="loading">Loading products…</p>';

  if (SHEET_CSV_URL.includes("PASTE_YOUR")) {
    container.innerHTML = `
      <div class="error">
        ⚠️ <strong>Setup needed:</strong> Open this file and paste your published Google Sheet CSV URL into
        <code>SHEET_CSV_URL</code> near the top of the &lt;script&gt; tag.
      </div>`;
    return;
  }

  try {
    const res = await fetch(SHEET_CSV_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    products = parseCSV(text);
    render(products);
  } catch (err) {
    container.innerHTML = `
      <div class="error">
        ⚠️ Could not load products: ${escapeHTML(err.message)}<br>
        <small>Check that your sheet is published to the web (File → Share → Publish to web → CSV).</small>
      </div>`;
  }
}

// --- Search ---
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) return render(products);
  const filtered = products.filter(p =>
    `${p.name} ${p.brand} ${p.barcode} ${p.category}`.toLowerCase().includes(q)
  );
  render(filtered);
});

loadProducts();
</script>

</body>
</html>
