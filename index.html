<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Warning Checker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#f4f6f5; --card:#fff; --ink:#122019; --muted:#5d6b64; --line:#e3e8e5; --chip:#eef2f0;
  --safe:#1f9d63; --fine:#c99a06; --limit:#ee7a1c; --avoid:#d93025; --track:#dde3e0;
  --safe-bg:#e7f5ee; --fine-bg:#fbf3d8; --limit-bg:#fdeddc; --avoid-bg:#fce6e4;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(18,32,25,.05),0 6px 20px -8px rgba(18,32,25,.12);
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",Roboto,system-ui,sans-serif;
}
body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid #7fb5ff;outline-offset:2px}
.page{max-width:660px;margin:0 auto;padding:0 18px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* HOME */
.home{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.home.hidden{display:none}
.mark{width:64px;height:64px;border-radius:20px;background:var(--ink);color:#fff;display:grid;place-items:center;margin-bottom:18px;box-shadow:var(--shadow)}
.mark .ico{width:32px;height:32px}
.home h1{font-size:34px;font-weight:700;letter-spacing:-.8px;margin-bottom:8px}
.tagline{color:var(--muted);font-size:15px;margin-bottom:28px}
.search-wrap{position:relative;width:100%;max-width:480px}
.search-wrap .ico{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search{width:100%;height:54px;padding:0 20px 0 48px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid transparent;border-radius:27px;box-shadow:var(--shadow);outline:none;transition:border-color .15s}
.search:focus{border-color:var(--ink)}
.search::placeholder{color:#8a9790}

/* RESULTS */
.results-page{display:none}
.results-page.active{display:block}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,246,245,.92);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 0}
.topbar .mark{width:40px;height:40px;border-radius:13px;margin:0;box-shadow:none;border:0;cursor:pointer}
.topbar .mark .ico{width:22px;height:22px}
.topbar .search-wrap{max-width:none;flex:1}
.topbar .search{height:44px;font-size:15px;border-radius:22px;padding-left:44px}
.topbar .search-wrap .ico{left:16px}
.stats{font-size:13px;color:var(--muted);margin:6px 2px 14px}

/* CARD */
.card{--t:var(--muted);--tbg:var(--chip);background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;display:grid;grid-template-columns:88px 1fr;gap:6px 14px;border-left:6px solid var(--t)}
.card.safe{--t:var(--safe);--tbg:var(--safe-bg)}
.card.fine{--t:var(--fine);--tbg:var(--fine-bg)}
.card.limit{--t:var(--limit);--tbg:var(--limit-bg)}
.card.avoid{--t:var(--avoid);--tbg:var(--avoid-bg);background:linear-gradient(180deg,#fff7f6,#fff 70%)}
.thumb{width:88px;height:88px;border-radius:var(--r-md);background:var(--chip);overflow:hidden;display:grid;place-items:center;color:#b3bdb7}
.thumb img{width:100%;height:100%;object-fit:cover}
.head{min-width:0}
.name{font-size:17px;font-weight:700;line-height:1.25;letter-spacing:-.2px}
.brand{font-size:13px;color:var(--muted);margin-top:2px}
.verdict{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin-top:6px}

/* TIER METER */
.meter{display:flex;gap:4px;flex-shrink:0}
.meter i{width:26px;height:8px;border-radius:4px;background:var(--track)}
.meter i.on{background:var(--t)}
.verdict-word{font-weight:700;font-size:15px;color:var(--t)}
.verdict-word small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.verdict-badge{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--tbg);color:var(--t);display:grid;place-items:center}
.verdict-badge .ico{width:18px;height:18px;stroke-width:2.4}

/* WARNING CHIPS */
.warns{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:flex;align-items:center;gap:6px;background:var(--chip);color:var(--ink);border-radius:12px;padding:6px 10px 6px 8px;font-size:12.5px;font-weight:600}
.wchip .ico{width:18px;height:18px}
.clean{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--safe)}
.limit-line{grid-column:1/-1;background:var(--tbg);border-radius:var(--r-sm);padding:10px 12px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center}
.limit-line .ico{color:var(--t);width:18px;height:18px}
.actions{grid-column:1/-1;display:flex;gap:8px;margin-top:4px}
.btn{flex:1;height:44px;border-radius:22px;font-size:14px;font-weight:700;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff}
.btn:active{transform:scale(.98)}
.more{display:block;width:100%;margin:6px 0 10px;height:48px;border-radius:24px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:700;color:var(--ink)}

/* SHEET */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.45);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:101;width:100%;max-width:660px;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 22px 28px;transform:translate(-50%,105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility .28s}
.sheet.open{transform:translate(-50%,0);visibility:visible}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sheet h2{font-size:21px;letter-spacing:-.3px;padding-right:8px}
.sheet .brand{margin-bottom:14px}
.sheet h3{font-size:14px;font-weight:700;margin:22px 0 10px}
.why{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.why:first-of-type{border-top:0}
.why .wi{width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;flex-shrink:0}
.why b{display:block;font-size:14.5px}
.why span{font-size:13px;color:var(--muted)}
.ing{font-size:13px;color:var(--muted);background:var(--paper);border-radius:var(--r-md);padding:14px;line-height:1.6}
.sheet .actions{margin-top:20px}
.store{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:var(--r-md);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.store:hover{border-color:var(--ink)}
.sub{font-size:13px;color:var(--muted);margin-bottom:16px}

/* STATES + LEGEND */
.empty,.loading{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}
.error{background:var(--avoid-bg);color:#8a1c14;padding:14px 16px;border-radius:var(--r-md);font-size:13px;margin-bottom:16px}
.submit-card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);text-align:center;padding:44px 24px}
.submit-card .wi{width:56px;height:56px;border-radius:18px;background:var(--chip);display:grid;place-items:center;margin:0 auto 16px}
.submit-card h3{font-size:18px;margin-bottom:8px}
.submit-card p{color:var(--muted);font-size:14px;max-width:340px;margin:0 auto 22px}
.submit-card a{display:inline-block;background:var(--ink);color:#fff;padding:13px 24px;border-radius:24px;text-decoration:none;font-weight:700;font-size:14px}
.legend{margin-top:36px;background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.legend h4{font-size:14px;margin-bottom:12px}
.legend .note{font-size:12.5px;color:var(--muted);margin:-4px 0 14px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px;margin-bottom:22px}
.lgrid:last-child{margin-bottom:0}
.litem{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.litem .meter i{width:12px;height:6px}
.litem b{color:var(--ink)}
footer{text-align:center;padding:28px 20px 48px;color:#8a9790;font-size:12px}
@media (max-width:420px){.card{grid-template-columns:72px 1fr}.thumb{width:72px;height:72px}.name{font-size:16px}.meter i{width:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">

  <section class="home" id="home">
    <div class="mark"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></div>
    <h1>Food Warning Checker</h1>
    <p class="tagline">Know what's really inside before you buy.</p>
    <div class="search-wrap">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search-home" class="search" type="text" placeholder="Search a product or brand" autocomplete="off" aria-label="Search a product">
    </div>
  </section>

  <section class="results-page" id="results-page">
    <div class="topbar">
      <button class="mark" onclick="goHome()" aria-label="Home"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></button>
      <div class="search-wrap">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search-top" class="search" type="text" placeholder="Search a product or brand" autocomplete="off" aria-label="Search a product">
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div id="results"></div>
    <div class="legend" id="legend"></div>
  </section>

  <footer>Your health matters.</footer>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></div>

<script>
// ============================================================
const SHEET_CSV_URL = "https://script.google.com/macros/s/AKfycbxbRzjmTnXM1ES13A4U-ohH7PXD4EuBWp9XwqHLZwM2PCbyo1LGeBxaFxiPLlEO3bzW8w/exec";
const FORM_URL = "https://forms.gle/SvL44DLJvkVobtud8";
const PAGE_SIZE = 20;   // results shown at a time (Scales perfectly to 2k+)
// ============================================================

// ---------- SYMBOLS + METER ----------
const WARN = {
  "🍭": {k:"sugar", label:"High sugar",       alias:["sugar"],        why:"Sugar is a leading ingredient or the amount per serving is high. It spikes blood sugar and adds empty calories."},
  "🧂": {k:"salt", label:"High salt",        alias:["salt"],         why:"Sodium is high for the serving. Regular excess raises blood pressure."},
  "🌴": {k:"fats", label:"Bad fats",         alias:["fats","fat","palm"], why:"Contains palm oil, hydrogenated or other refined fats that are high in saturated or trans fat."},
  "🌾": {k:"flour", label:"Refined flour",    alias:["flour","maida"], why:"Made mainly with maida. The fibre is stripped out, so it digests fast and keeps you full for less time."},
  "⚠️": {k:"additives", label:"Additives",        alias:["additives"],    why:"Contains artificial additives such as flavour enhancers, emulsifiers or stabilisers."},
  "⚠":  {k:"additives", label:"Additives",        alias:["additives"],    why:"Contains artificial additives such as flavour enhancers, emulsifiers or stabilisers."},
  "🎨": {k:"colours", label:"Artificial colour",alias:["colours","colors","colour","color"], why:"Uses synthetic colours that add no nutrition and are best avoided, especially for children."},
  "🧪": {k:"preserv", label:"Preservatives",    alias:["preservatives","preservative"], why:"Contains chemical preservatives to extend shelf life."},
  "🏭": {k:"ultra", label:"Ultra-processed",  alias:["ultra"],        why:"Industrially formulated from refined ingredients and additives, far from the original food."}
};
const TIERS = {
  safe:  {n:1, word:"Safe",  sub:"Enjoy freely",          icon:"check"},
  fine:  {n:2, word:"Fine",  sub:"In moderation",         icon:"check"},
  limit: {n:3, word:"Limit", sub:"Watch how much",        icon:"alert"},
  avoid: {n:4, word:"Avoid", sub:"Occasional treat only", icon:"x"}
};

const svg = d => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICONS = {
  sugar: svg('<path d="M12 3l7 4v8l-7 4-7-4V7z"/><path d="M5 7l7 4 7-4M12 11v8"/>'),
  salt: svg('<path d="M9 3h6v3H9zM8 6h8l1 14a1 1 0 01-1 1H8a1 1 0 01-1-1z"/><circle cx="12" cy="12" r=".6"/><circle cx="10" cy="15.5" r=".6"/><circle cx="14" cy="15.5" r=".6"/>'),
  fats: svg('<path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/><path d="M9 15a3 3 0 003 3"/>'),
  flour: svg('<path d="M12 21V9M12 9c-2.5 0-4-1.5-4-4 2.5 0 4 1.5 4 4zM12 9c2.5 0 4-1.5 4-4-2.5 0-4 1.5-4 4zM12 15c-2.5 0-4-1.5-4-4M12 15c2.5 0 4-1.5 4-4"/>'),
  additives: svg('<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 8.5v4.5"/><circle cx="12" cy="16.2" r=".5"/>'),
  colours: svg('<path d="M12 3a9 9 0 100 18c1.4 0 2-1 1.5-2-.6-1.2.2-2.5 1.6-2.5H17a4 4 0 004-4c0-5-4-9.5-9-9.5z"/><circle cx="8" cy="11" r=".7"/><circle cx="12" cy="7.5" r=".7"/><circle cx="16" cy="9.5" r=".7"/>'),
  preserv: svg('<circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 3h5"/>'),
  ultra: svg('<path d="M3 21V12l6 3.5V12l6 3.5V5h6v16z"/>'),
  check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  alert: svg('<path d="M12 7v6M12 17h.01"/>'),
  x: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  bite: svg('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),
  plate: svg('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/>')
};

// ---------- DATA LAYER ----------
let products = [], shown = [], visible = PAGE_SIZE;

function parseCSV(text) {
  const rows = []; let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') {}
      else field += c;
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows.shift().map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(c => (c || "").trim() !== ""))
    .map(r => Object.fromEntries(headers.map((h, i) => [h, (r[i] || "").trim()])));
}

function escapeHTML(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// 🟢 BULLETPROOF WARNING PARSER
// This catches the emojis flawlessly, stripping out Google Sheet's hidden characters
function parseWarnings(s) {
  if (!s) return [];
  let clean = String(s).replace(/\uFE0F/g, "").toLowerCase();
  let out = [];
  
  for (const e in WARN) {
    if (clean.includes(e.toLowerCase()) || WARN[e].alias.some(a => new RegExp("\\b" + a + "\\b").test(clean))) {
      if (!out.includes(e)) out.push(e);
    }
  }
  return out;
}

function tierFromText(t) {
  t = String(t || "").toLowerCase();
  const word = ["avoid", "limit", "fine", "safe"].find(k => t.includes(k));
  if (word) return word;
  const dot = {"🔴":"avoid", "🟠":"limit", "🟡":"fine", "🟢":"safe"};
  const e = Object.keys(dot).find(d => t.includes(d));
  return e ? dot[e] : "";
}

function analyse(p) {
  return { list: parseWarnings(p.warnings), key: tierFromText(p.tier), advice: (p.limit || "").trim() };
}

function prepare(rows) {
  return rows.map((p, i) => {
    p._id = i;
    try { p._a = analyse(p); } catch (e) { p._a = { list: [], key: "", advice: "" }; }
    p._s = `${p.name} ${p.brand} ${p.category} ${p.barcode}`.toLowerCase();
    return p;
  });
}

// ---------- COMPONENTS ----------
function meterHTML(key) {
  const n = TIERS[key] ? TIERS[key].n : 0;
  return `<div class="meter" aria-hidden="true">${[1,2,3,4].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</div>`;
}

function verdictHTML(key, raw) {
  const t = TIERS[key];
  if (!t) return raw ? `<div class="verdict"><div class="verdict-word" style="color:var(--muted)">${escapeHTML(raw)}</div></div>` : "";
  return `<div class="verdict">${meterHTML(key)}
    <div class="verdict-word">${t.word}<small>${t.sub}</small></div>
    <div class="verdict-badge">${ICONS[t.icon]}</div></div>`;
}

function warnsHTML(list) {
  if (!list.length) return `<div class="warns"><div class="clean">${ICONS.check} No warnings flagged</div></div>`;
  return `<div class="warns">${list.map(e => `<span class="wchip">${ICONS[WARN[e].k]}${WARN[e].label}</span>`).join("")}</div>`;
}

function cardHTML(p) {
  try {
    const a = p._a;
       const img = p.image_url
      ? `<img src="${escapeHTML(p.image_url)}" alt="" loading="lazy" onerror="this.style.display='none'; this.parentNode.innerHTML='${ICONS.plate}';">` : ICONS.plate;
    return `
    <article class="card ${a.key}">
      <div class="thumb">${img}</div>
      <div class="head">
        <h3 class="name">${escapeHTML(p.name || "Unnamed")}</h3>
        <div class="brand">${escapeHTML(p.brand)}</div>
      </div>
      ${verdictHTML(a.key, p.tier)}
      ${warnsHTML(a.list)}
      ${a.advice ? `<div class="limit-line">${ICONS.bite}<span>${escapeHTML(a.advice)}</span></div>` : ""}
      <div class="actions">
        <button class="btn" onclick="openDetails(${p._id})">Why?</button>
        <button class="btn primary" onclick="openStores(${p._id})">Buy now</button>
      </div>
    </article>`;
  } catch (e) { return ""; }
}

function render(query = "") {
  const box = document.getElementById("results"), stats = document.getElementById("stats");
  if (!shown.length) {
    box.innerHTML = query ? `
      <div class="submit-card">
        <div class="wi">${ICONS.search}</div>
        <h3>"${escapeHTML(query)}" isn't in our database yet</h3>
        <p>Snap a photo of the ingredients label and submit it. We'll add it.</p>
        <a href="${FORM_URL}" target="_blank" rel="noopener">Submit this product</a>
      </div>` : '<p class="empty">No products found.</p>';
    stats.textContent = ""; return;
  }
  const part = shown.slice(0, visible);
  stats.textContent = `Showing ${part.length} of ${shown.length} matches`;
  box.innerHTML = part.map(cardHTML).join("") +
    (shown.length > visible ? `<button class="more" onclick="showMore()">Show more</button>` : "");
}

function showMore() { visible += PAGE_SIZE; render(searchTop.value.trim()); }

function renderLegend() {
  document.getElementById("legend").innerHTML = `
    <h4>What the symbols mean</h4>
    <div class="lgrid">${Object.values(WARN).map(w => `<div class="litem"><span class="wchip" style="padding:6px">${ICONS[w.k]}</span>${w.label}</div>`).join("")}</div>
    <h4>What the meter means</h4>
    <p class="note">The meter is the overall rating for each product.</p>
    <div class="lgrid">${Object.keys(TIERS).map(k => `<div class="litem" style="--t:var(--${k})">${meterHTML(k)}<span><b>${TIERS[k].word}</b> ${TIERS[k].sub}</span></div>`).join("")}</div>`;
}

// ---------- SHEET MODALS ----------
const sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim"), sbody = document.getElementById("sheet-body");
function openSheet(html) { sbody.innerHTML = html; sheet.scrollTop = 0; sheet.classList.add("open"); scrim.classList.add("open"); }
function closeSheet() { sheet.classList.remove("open"); scrim.classList.remove("open"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function openDetails(id) {
  const p = products[id]; if (!p) return;
  const a = p._a, t = TIERS[a.key];
  const whyHTML = a.list.length
    ? a.list.map(e => `<div class="why"><div class="wi">${ICONS[WARN[e].k]}</div><div><b>${WARN[e].label}</b><span>${WARN[e].why}</span></div></div>`).join("")
    : `<div class="why"><div class="wi" style="color:var(--safe)">${ICONS.check}</div><div><b>Nothing flagged</b><span>No sugar, salt, fat, refining or additive concerns were found for this product.</span></div></div>`;
  openSheet(`
    <h2>${escapeHTML(p.name)}</h2>
    <div class="brand">${escapeHTML(p.brand)}</div>
    <div class="card ${a.key}" style="box-shadow:none;border-left:0;padding:0;margin:0;display:block;background:none">
      ${t ? `<div class="verdict" style="margin:0 0 4px">${meterHTML(a.key)}<div class="verdict-word">${t.word}<small>${t.sub}</small></div></div>` : ""}
      ${a.advice ? `<div class="limit-line" style="margin-top:12px">${ICONS.bite}<span>${escapeHTML(a.advice)}</span></div>` : ""}
    </div>
    <h3>Why these warnings</h3>${whyHTML}
    ${p.ingredients_raw ? `<h3>Ingredients on the label</h3><div class="ing">${escapeHTML(p.ingredients_raw)}</div>` : ""}
    <div class="actions"><button class="btn" onclick="closeSheet()">Close</button><button class="btn primary" onclick="openStores(${id})">Buy now</button></div>`);
}

function openStores(id) {
  const p = products[id]; if (!p) return;
  const q = encodeURIComponent(`${p.brand || ""} ${p.name || ""}`.trim());
  const stores = [
    ["Blinkit", `https://blinkit.com/s/?q=${q}`],
    ["Zepto", `https://www.zeptonow.com/search?query=${q}`],
    ["Swiggy Instamart", `https://www.swiggy.com/instamart/search?custom_query=${q}`],
    ["BigBasket", `https://www.bigbasket.com/ps/?q=${q}`],
    ["JioMart", `https://www.jiomart.com/search/${q}`],
    ["Amazon", `https://www.amazon.in/s?k=${q}`],
    ["Flipkart", `https://www.flipkart.com/search?q=${q}`]
  ];
  openSheet(`<h2>${escapeHTML(p.name)}</h2><p class="sub">Choose a store to search for this product</p>
    ${stores.map(([n, u]) => `<a class="store" href="${u}" target="_blank" rel="noopener">${n}<span>↗</span></a>`).join("")}`);
}

// ---------- SEARCH + STATE ----------
const homeEl = document.getElementById("home"), resultsEl = document.getElementById("results-page");
const searchHome = document.getElementById("search-home"), searchTop = document.getElementById("search-top");

function filterAndRender(q) {
  visible = PAGE_SIZE;
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  shown = words.length ? products.filter(p => words.every(w => p._s.includes(w))) : products;
  render(q);
}

function goToResults(q) {
  homeEl.classList.add("hidden"); resultsEl.classList.add("active");
  searchTop.value = q; filterAndRender(q);
  searchTop.focus(); searchTop.setSelectionRange(q.length, q.length);
}

function goHome() {
  resultsEl.classList.remove("active"); homeEl.classList.remove("hidden");
  searchTop.value = ""; searchHome.value = ""; searchHome.focus();
}

let timer;
const debounce = fn => e => { clearTimeout(timer); timer = setTimeout(() => fn(e), 120); };

searchHome.addEventListener("input", e => { const q = e.target.value.trim(); if (q.length >= 2) goToResults(q); });
searchHome.addEventListener("keydown", e => { if (e.key === "Enter") { const q = e.target.value.trim(); if (q) goToResults(q); } });
searchTop.addEventListener("input", debounce(e => filterAndRender(e.target.value.trim())));

// ---------- LOAD ----------
async function loadProducts() {
  const box = document.getElementById("results");
  box.innerHTML = '<p class="loading">Loading…</p>';
  
  try {
    const res = await fetch(SHEET_CSV_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    
    // Fetch as JSON instead of CSV
    const jsonData = await res.json();
    
    // Pass data directly to our prepare function
    products = prepare(jsonData);
    
    if (resultsEl.classList.contains("active")) {
      filterAndRender(searchTop.value.trim());
    } else {
      box.innerHTML = "";
    }
  } catch (err) {
    box.innerHTML = `<div class="error">Could not load products: ${escapeHTML(err.message)}</div>`;
  }
}

renderLegend();
loadProducts();
</script>
</body>
